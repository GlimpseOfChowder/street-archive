# Street Archive — keeps the free Supabase database awake and checks it's healthy.
# Supabase pauses free projects after 7 days without activity; this makes one tiny
# read every day (a few hundred bytes — nothing against the free limits).
# If the database is down or paused, the run fails and GitHub emails you.
name: Keep database awake

on:
  schedule:
    - cron: "17 22 * * *"   # every day at 6:17 AM Manila time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from Supabase
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            "https://mdhhxcdmzduwcfgbamcr.supabase.co/rest/v1/crews?select=id&limit=1" \
            -H "apikey: sb_publishable__ePovCY0RWe897sAV8WtzQ_VGNO2XUH")
          echo "Supabase answered HTTP $code"
          cat /tmp/out.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase didn't answer normally (HTTP $code). It may be paused — open the Supabase dashboard and press Restore."
            exit 1
          fi
